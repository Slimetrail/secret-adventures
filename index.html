<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1030"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Secret of the Adventures</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
#view{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:auto;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 45%,rgba(5,0,15,.55) 100%)}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:66px;color:#fff;font:600 13px system-ui;background:rgba(10,5,25,.55);padding:4px 8px;border-radius:6px;pointer-events:none}
.ink{border:2.5px solid #2b1a0e;background:radial-gradient(circle at 35% 30%,#efe0b8,#d9c08a 70%,#b8965e);color:#2b1a0e;box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 0 6px rgba(90,55,20,.45);touch-action:none;padding:0;-webkit-tap-highlight-color:transparent}
.ink svg{width:62%;height:62%;display:block;margin:auto;pointer-events:none}
.ink:active,.ink.pressed{filter:brightness(.82);transform:translateY(1px)}
#dbg{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;width:48px;height:48px;border-radius:50%;font:700 20px Georgia,serif}
#mapb{position:fixed;top:calc(6px + env(safe-area-inset-top));left:8px;width:48px;height:48px;border-radius:12px 9px 13px 8px}
#bar{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;padding:0 12px;pointer-events:none}
#bar>*{pointer-events:auto}
.pad{display:flex;gap:8px}#padL{flex-direction:column}
.pad button{width:62px;height:62px;border-radius:14px 11px 15px 10px}
#slots{flex:1;display:grid;grid-template-columns:repeat(2,52px);gap:6px;justify-content:center;align-content:end;margin:0 6px}
@media (min-aspect-ratio:1/1){#slots{grid-template-columns:repeat(4,56px)}.slot{height:56px!important}}
.slot{width:auto;height:52px;border-radius:9px 12px 8px 11px;border:2.5px dashed #2b1a0e;background:radial-gradient(circle at 40% 35%,rgba(239,224,184,.92),rgba(196,166,110,.9));box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 0 8px rgba(90,55,20,.5);padding:0;touch-action:none}
.slot:nth-child(2){transform:rotate(1.2deg)}.slot:nth-child(3){transform:rotate(-1deg)}.slot:nth-child(4){transform:rotate(.7deg)}
.slot.pressed{animation:sp .18s ease-out}@keyframes sp{50%{filter:brightness(.75);scale:.92}}
.slot svg{width:60%;height:60%;opacity:.35;pointer-events:none}
#updb{display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:10px;border:0;background:#e8c070;font:600 14px system-ui}
#map{display:none;position:fixed;inset:0;background:#2a1a10;touch-action:none}#map.open{display:block}
#mapc{position:absolute;inset:0;width:100%;height:100%;display:block}
#mclose{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;width:48px;height:48px;border-radius:50%}
#mtools{position:absolute;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#mtools button{width:48px;height:48px;border-radius:12px 9px 13px 8px;font:700 26px Georgia,serif}
#puz{display:none;position:fixed;inset:0;background-color:#e3cf9f;background-size:cover,512px 512px;color:#2b1a0e;font-family:Georgia,serif;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 12px;box-sizing:border-box;overflow:hidden;touch-action:none}
#puz.open{display:flex}#puz.land{flex-direction:row;align-items:center;justify-content:center;gap:14px}
#pside{display:flex;flex-direction:column;align-items:center;width:100%;max-width:520px}#puz.land #pside{width:270px;flex:none}
#ptitle{font:italic 700 21px Georgia,serif;margin:6px 56px 2px;text-align:center}#puz.land #ptitle{margin:6px 0 2px 56px;font-size:19px}
#pinfo{font:16px Georgia,serif;text-align:center;margin:18px 6px 8px;line-height:1.3}
#pstat{min-height:24px;font:700 17px Georgia,serif;text-align:center}#pstat.bad{color:#9a1c14}
#ptools{display:flex;gap:10px;margin-top:6px}
#pclose{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;width:48px;height:48px;border-radius:50%}
#preset{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;width:48px;height:48px;border-radius:12px 9px 13px 8px}
#penter{display:none;min-width:150px;height:52px;border-radius:12px 9px 13px 8px;font:700 18px Georgia,serif;margin-top:8px}
#pboard{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
#pboard.done .pgrid{box-shadow:0 0 0 3px #2b1a0e,0 0 26px 8px rgba(255,210,90,.9)}
.pgrid{position:relative;border:3px solid #2b1a0e;border-radius:6px 9px 5px 8px;box-shadow:0 0 0 1px rgba(43,26,14,.4),inset 0 0 14px rgba(90,55,20,.45);transition:box-shadow .4s}
.pcell{position:absolute;box-sizing:border-box;border:1px dashed rgba(43,26,14,.25)}
.pz{border:2.5px solid #2b1a0e;background:radial-gradient(circle at 35% 30%,#efe0b8,#d9c08a 70%,#b8965e);color:#2b1a0e;box-shadow:0 2px 0 rgba(0,0,0,.45);padding:0;touch-action:none;font-family:Georgia,serif;-webkit-tap-highlight-color:transparent}
.pz:active{filter:brightness(.82)}
.pmir,.ptile,.pblk{position:absolute;box-sizing:border-box}.pmir{border-radius:6px;background:rgba(239,224,184,.55)}
.ptile{font-weight:700;border-radius:7px 5px 8px 6px}
.pblk{background:linear-gradient(135deg,#8a5a30,#5a3418);border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,230,190,.25),0 2px 0 rgba(0,0,0,.45)}.pblk.key{background:linear-gradient(135deg,#f0c850,#b8861c)}.pblk.sel{outline:4px solid #1f4fd8;outline-offset:1px}
.pblocks{background-image:linear-gradient(rgba(43,26,14,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(43,26,14,.18) 1px,transparent 1px)}
.pexit{position:absolute;background:repeating-linear-gradient(45deg,#2b1a0e 0 4px,#c9a24a 4px 8px);border:2px solid #2b1a0e}
.parrows{display:flex;gap:18px}.parr{width:64px;height:56px;border-radius:12px 9px 13px 8px;font-size:26px}
.prow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.plever{border-radius:10px 8px 11px 7px;display:flex;align-items:center;justify-content:center}
.plamp.on{filter:drop-shadow(0 0 8px rgba(255,210,80,.95))}
.pq{font:18px Georgia,serif;text-align:center;max-width:420px;line-height:1.35;padding:6px 8px}.pstep{font:italic 14px Georgia,serif;opacity:.75;margin-bottom:4px}
.popts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(340px,86vw)}.popt{min-height:52px;font:600 18px Georgia,serif;border-radius:10px 8px 11px 7px}
.pclues{display:flex;flex-direction:column;gap:4px;max-height:42vh;overflow:auto}.pclue{display:flex;align-items:center;gap:4px}
.pdig{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border:2px solid #2b1a0e;border-radius:5px;font:700 16px Georgia,serif;background:rgba(239,224,184,.7)}
.pdig.big{width:40px;height:44px;font-size:24px}.pfb{margin-left:8px;font-size:20px;letter-spacing:2px;min-width:70px}.pentry{display:flex;gap:6px}
.pkeys{display:grid;grid-template-columns:repeat(5,48px);gap:6px}.pkey{width:48px;height:48px;font:700 20px Georgia,serif;border-radius:9px 7px 10px 6px}.pkey.used{opacity:.45}
#puz.land #pboard{flex-direction:row;flex-wrap:wrap;justify-content:center;max-height:calc(100vh - 20px)}
#panel{display:none;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:min(320px,86vw);padding:20px 16px;border:3px solid #2b1a0e;border-radius:10px 14px 9px 12px;background:radial-gradient(circle at 40% 35%,#efe0b8,#cdb07a);color:#2b1a0e;font:18px Georgia,serif;text-align:center;box-shadow:0 6px 30px rgba(0,0,0,.6)}
#panel.open{display:block}#pgo{margin-top:14px;min-width:140px;height:50px;border-radius:12px 9px 13px 8px;font:700 18px Georgia,serif}
</style></head><body>
